services:
  inference4free:
    build: .
    image: blastbeng/inference4free:latest
    # Always build locally; never pull the image from a registry
    pull_policy: build
    container_name: inference4free
    # Lifecycle managed by systemd (docker-compose@.service)
    restart: no
    # Container-level health state (visible in `docker ps`); hung processes
    # are still handled by the systemd unit, which restarts the whole stack.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Cap the json-file log so it cannot grow unbounded
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${I4F_PORT:-8000}:8000"
    # Every documented knob in .env reaches the container automatically —
    # no per-var passthrough maintenance. The environment: block below
    # takes precedence and pins the container-internal bind points.
    env_file:
      - path: .env
        required: false
    environment:
      # The container ALWAYS binds 0.0.0.0:8000; the host port comes from
      # the ports: mapping (${I4F_PORT}). Never let .env leak these.
      - I4F_PORT=8000
      - I4F_HOST=0.0.0.0
      # Optional manual override only — the credential bot creates and renews
      # accounts automatically; leave empty for fully autonomous operation.
      - DEEPSEEK_AUTH_TOKEN=${DEEPSEEK_AUTH_TOKEN:-}
      # Optional: require clients to send this as their API key
      - I4F_API_KEY=${I4F_API_KEY:-}
      # Optional: override model names exposed on /v1/models
      - I4F_MODEL_THINKER=${I4F_MODEL_THINKER:-deepseek-reasoner}
      - I4F_MODEL_FAST=${I4F_MODEL_FAST:-deepseek-chat}
      - I4F_MODEL_SEARCH=${I4F_MODEL_SEARCH:-deepseek-search}
      # Gemini web-chat session cookies (reverse-engineered, no official API key)
      - GEMINI_1PSID=${GEMINI_1PSID:-}
      - GEMINI_1PSIDTS=${GEMINI_1PSIDTS:-}
      # ChatGPT web session (reverse-engineered, no official API key)
      - CHATGPT_ACCESS_TOKEN=${CHATGPT_ACCESS_TOKEN:-}
      - CHATGPT_SESSION_COOKIES=${CHATGPT_SESSION_COOKIES:-}
      # New reverse-engineered web providers (see .env.example for details)
      - CLAUDE_SESSION_KEY=${CLAUDE_SESSION_KEY:-}
      - CLAUDE_COOKIES=${CLAUDE_COOKIES:-}
      - GROK_SSO=${GROK_SSO:-}
      - GROK_COOKIES=${GROK_COOKIES:-}
      - MISTRAL_SESSION_TOKEN=${MISTRAL_SESSION_TOKEN:-}
      - MISTRAL_COOKIES=${MISTRAL_COOKIES:-}
      - QWEN_TOKEN=${QWEN_TOKEN:-}
      - QWEN_UMID=${QWEN_UMID:-}
      - QWEN_BX_UA=${QWEN_BX_UA:-}
      - QWEN_COOKIES=${QWEN_COOKIES:-}
      # Operator seed for the qwen renewal rungs (HTTP re-login, no browser):
      # register once at chat.qwen.ai and set these — renewals are then fully
      # automatic. Without them the signup rung (Aliyun slider) is the only path.
      - QWEN_LOGIN_EMAIL=${QWEN_LOGIN_EMAIL:-}
      - QWEN_LOGIN_PASSWORD=${QWEN_LOGIN_PASSWORD:-}
      - KIMI_TOKEN=${KIMI_TOKEN:-}
      - KIMI_COOKIES=${KIMI_COOKIES:-}
      - COPILOT_COOKIES=${COPILOT_COOKIES:-}
      - PERPLEXITY_COOKIES=${PERPLEXITY_COOKIES:-}
      - GLM_REFRESH_TOKEN=${GLM_REFRESH_TOKEN:-}
      - GLM_COOKIES=${GLM_COOKIES:-}
      - I4F_PROVIDERS=${I4F_PROVIDERS:-}
      # default false: the z.ai browser transport costs ~1.3 GB peak (chromium)
      # and anonymous z.ai has no keyless HTTP path (Aliyun Captcha 2.0 wall)
      - I4F_ZAI_BROWSER=${I4F_ZAI_BROWSER:-false}
      - I4F_ZAI_HEADLESS=${I4F_ZAI_HEADLESS:-false}
      - I4F_ZAI_START_TIMEOUT=${I4F_ZAI_START_TIMEOUT:-90}
      - I4F_ZAI_IDLE_TIMEOUT=${I4F_ZAI_IDLE_TIMEOUT:-60}
      - I4F_ZAI_TOTAL_TIMEOUT=${I4F_ZAI_TOTAL_TIMEOUT:-300}
      - I4F_ZAI_BUSY_TIMEOUT=${I4F_ZAI_BUSY_TIMEOUT:-180}
      - I4F_ZAI_CONTEXT_LENGTH=${I4F_ZAI_CONTEXT_LENGTH:-10000}
      - I4F_ZAI_PARALLEL=${I4F_ZAI_PARALLEL:-1}
      - I4F_ZAI_STALE_AFTER=${I4F_ZAI_STALE_AFTER:-600}
      - I4F_CHATGPT_RELAY_STALE_AFTER=${I4F_CHATGPT_RELAY_STALE_AFTER:-600}
      - I4F_QWEN_RELAY_STALE_AFTER=${I4F_QWEN_RELAY_STALE_AFTER:-600}
      - I4F_ZAI_MAX_OUTPUT=${I4F_ZAI_MAX_OUTPUT:-2048}
      - I4F_CONTEXT_LENGTH=${I4F_CONTEXT_LENGTH:-131072}
      - I4F_MAX_OUTPUT=${I4F_MAX_OUTPUT:-32768}
      - I4F_MAX_OUTPUT_THINKING=${I4F_MAX_OUTPUT_THINKING:-65536}
      - I4F_ZAI_MODELS_TTL=${I4F_ZAI_MODELS_TTL:-900}
      - I4F_HTTP_CONNECT_TIMEOUT=${I4F_HTTP_CONNECT_TIMEOUT:-6}
      - I4F_COPILOT_HARVEST=${I4F_COPILOT_HARVEST:-true}
      # Dynamic model discovery TTL + fallback chains
      - I4F_MODELS_TTL=${I4F_MODELS_TTL:-300}
      - I4F_FALLBACKS=${I4F_FALLBACKS:-}
      - I4F_DEFAULT_FALLBACKS=${I4F_DEFAULT_FALLBACKS:-}
      # Outbound proxy rotation (dsk/proxies.py): fast-only free proxies + direct
      - I4F_PROXY=${I4F_PROXY:-}
      - I4F_PROXIES=${I4F_PROXIES:-}
      - I4F_PROXY_MAX_LATENCY=${I4F_PROXY_MAX_LATENCY:-800}
      - I4F_PROXY_DIRECT=${I4F_PROXY_DIRECT:-true}
      - I4F_LLMTRIM=${I4F_LLMTRIM:-true}
      - I4F_PROXY_AUTO=${I4F_PROXY_AUTO:-false}
      - I4F_PROXY_SOURCES=${I4F_PROXY_SOURCES:-}
      - I4F_PROXY_MAX_POOL=${I4F_PROXY_MAX_POOL:-400}
      - I4F_PROXY_LIST_URL=${I4F_PROXY_LIST_URL:-}
      - I4F_PROXY_LIST_URLS=${I4F_PROXY_LIST_URLS:-}
      - I4F_PROXY_LIST_TTL=${I4F_PROXY_LIST_TTL:-1800}
      - I4F_PROXY_CHECK=${I4F_PROXY_CHECK:-false}
      - I4F_PROXY_CHECK_URL=${I4F_PROXY_CHECK_URL:-https://api.ipify.org?format=json}
      - I4F_PROXY_CHECK_TTL=${I4F_PROXY_CHECK_TTL:-1800}
      - I4F_PROXY_CHECK_TIMEOUT=${I4F_PROXY_CHECK_TIMEOUT:-4}
      - I4F_PROXY_CHECK_CONCURRENCY=${I4F_PROXY_CHECK_CONCURRENCY:-24}
      - I4F_PROXY_ENSURE_TIMEOUT=${I4F_PROXY_ENSURE_TIMEOUT:-30}
      - I4F_PROXY_MODE=${I4F_PROXY_MODE:-random}
      - I4F_PROXY_EXCLUDE=${I4F_PROXY_EXCLUDE:-}
      - I4F_PROXY_COOLDOWN=${I4F_PROXY_COOLDOWN:-120}
      - I4F_PROXY_ROTATE_TTL=${I4F_PROXY_ROTATE_TTL:-300}
      # Self-maintenance: upstream-breakage detection + LLM auto-patch
      # (dsk/selfheal.py); audit trail under /data/selfheal
      - I4F_SELFHEAL=${I4F_SELFHEAL:-true}
      - I4F_SELFHEAL_PROBE_TTL=${I4F_SELFHEAL_PROBE_TTL:-600}
      - I4F_SELFHEAL_TRIGGER=${I4F_SELFHEAL_TRIGGER:-3}
      - I4F_SELFHEAL_COOLDOWN=${I4F_SELFHEAL_COOLDOWN:-3600}
      - I4F_SELFHEAL_MAX_ATTEMPTS=${I4F_SELFHEAL_MAX_ATTEMPTS:-3}
      - I4F_SELFHEAL_MAX_INCIDENTS=${I4F_SELFHEAL_MAX_INCIDENTS:-4}
      - I4F_SELFHEAL_EXCLUDE=${I4F_SELFHEAL_EXCLUDE:-}
      - I4F_SELFHEAL_FIXER_BASE_URL=${I4F_SELFHEAL_FIXER_BASE_URL:-}
      - I4F_SELFHEAL_FIXER_API_KEY=${I4F_SELFHEAL_FIXER_API_KEY:-}
      - I4F_SELFHEAL_FIXER_MODELS=${I4F_SELFHEAL_FIXER_MODELS:-}
      - I4F_SELFHEAL_LOCAL=${I4F_SELFHEAL_LOCAL:-true}
      # Credential renewal bot (dsk/refresher.py): keeps jars/tokens fresh
      - I4F_REFRESHER=${I4F_REFRESHER:-true}
      - I4F_REFRESHER_TTL=${I4F_REFRESHER_TTL:-21600}
      - I4F_REFRESHER_COOLDOWN=${I4F_REFRESHER_COOLDOWN:-1800}
      - I4F_REFRESHER_MAX_RENEWS=${I4F_REFRESHER_MAX_RENEWS:-6}
      - I4F_REFRESHER_EXCLUDE=${I4F_REFRESHER_EXCLUDE:-}
      # signup attempts are multi-minute browser flows: after 3 consecutive
      # failures the rung sleeps 12h (not 30min) so a never-succeeding
      # signup cannot burn RAM all day
      - I4F_SIGNUP_BREAKER_COOLDOWN_S=${I4F_SIGNUP_BREAKER_COOLDOWN_S:-43200}
      # auto-router latency bounds: HTTP providers must yield a first token
      # within 60s (no browser cold-start to excuse them) and one request may
      # walk the fallback chain for at most 7 minutes before failing fast
      - I4F_HTTP_FIRST_TOKEN_TIMEOUT=${I4F_HTTP_FIRST_TOKEN_TIMEOUT:-60}
      - I4F_AUTO_WALK_BUDGET=${I4F_AUTO_WALK_BUDGET:-420}
      - I4F_STREAM_SILENCE_TIMEOUT=${I4F_STREAM_SILENCE_TIMEOUT:-180}
      - I4F_QUOTA_COOLDOWN_S=${I4F_QUOTA_COOLDOWN_S:-120}
      - I4F_REFRESHER_LOGIN=${I4F_REFRESHER_LOGIN:-true}
      - I4F_REFRESHER_HEADLESS=${I4F_REFRESHER_HEADLESS:-true}
      - I4F_REFRESHER_AUTOSIGNUP=${I4F_REFRESHER_AUTOSIGNUP:-true}
      # Anonymous providers whose refusals are egress-shaped (Copilot geo-block,
      # Perplexity datacenter-IP authwall): the ladder rotates their proxy
      # assignment instead of running the credential ladder they don't have.
      - I4F_EGRESS_ROTATE=${I4F_EGRESS_ROTATE:-copilot,perplexity}
      - I4F_BREAKER_N=${I4F_BREAKER_N:-3}
      - I4F_BREAKER_COOLDOWN_S=${I4F_BREAKER_COOLDOWN_S:-1800}
      - I4F_SIGNUP_PROXY=${I4F_SIGNUP_PROXY:-}
      - DEEPSEEK_LOGIN_EMAIL=${DEEPSEEK_LOGIN_EMAIL:-}
      - DEEPSEEK_LOGIN_PASSWORD=${DEEPSEEK_LOGIN_PASSWORD:-}
      - GEMINI_LOGIN_EMAIL=${GEMINI_LOGIN_EMAIL:-}
      - GEMINI_LOGIN_PASSWORD=${GEMINI_LOGIN_PASSWORD:-}
      - CHATGPT_LOGIN_EMAIL=${CHATGPT_LOGIN_EMAIL:-}
      - CHATGPT_LOGIN_PASSWORD=${CHATGPT_LOGIN_PASSWORD:-}
      - I4F_MAIL_AUTOGEN=${I4F_MAIL_AUTOGEN:-true}
      - I4F_MAIL_DOMAIN=${I4F_MAIL_DOMAIN:-}
      - I4F_MAIL_IMAP_HOST=${I4F_MAIL_IMAP_HOST:-}
      - I4F_MAIL_IMAP_PORT=${I4F_MAIL_IMAP_PORT:-993}
      - I4F_MAIL_IMAP_USER=${I4F_MAIL_IMAP_USER:-}
      - I4F_MAIL_IMAP_PASS=${I4F_MAIL_IMAP_PASS:-}
      - I4F_MAIL_OTP_SENDER=${I4F_MAIL_OTP_SENDER:-deepseek}
      - I4F_MAIL_OTP_MAX_AGE=${I4F_MAIL_OTP_MAX_AGE:-30}
      - I4F_MAIL_OTP_REGEX=${I4F_MAIL_OTP_REGEX:-}
      - DOCKERMODE=true
    extra_hosts:
      # host-gateway access for host-published operator services
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist cf_clearance cookies across container restarts (local ./data dir)
      - ./data:/data
    shm_size: "1gb"
    # Keep DrissionPage/Chrome temp profiles out of the container writable
    # layer: without this, /tmp grows unbounded inside the overlay snapshot
    # (~11 GB observed). tmpfs is RAM-backed and discarded on stop.
    tmpfs:
      - /tmp:size=1g
    # Guardrail for small hosts (8 GB RAM + zram): the z.ai browser pool and
    # the python server sit well below ~1 GB after idle-reaper tuning; this
    # cap only catches runaway leaks (renderer growth, browser pile-up)
    # before they OOM the host. Container exit is handled by the systemd unit.
    mem_limit: 1g
